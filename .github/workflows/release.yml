# Builds the portable app for Linux, Windows and macOS, tests each archive, and
# publishes them on the GitHub Releases page when a version tag (v*) is pushed.
# Run it by hand (Actions > Release > Run workflow) to build and test; give it a tag such as
# v1.0.0 to also publish a release with that tag on the current commit.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'tools/package.py'
      - 'tools/build_jwasm.sh'
      - 'main.py'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish a release with this new tag (e.g. v1.0.0); leave empty to only build and test'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported Ubuntu, so the Linux build runs on glibc 2.35 and newer
          - { name: linux-x64, os: ubuntu-22.04 }
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('dev-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        # the Qt xcb plugin's libraries, so PyInstaller bundles them, and Xvfb for the test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libxcb-shape0 libxcb-randr0 libxcb-cursor0 xvfb

      - name: Set up Visual C++ (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build JWasm
        run: tools/build_jwasm.sh

      - name: Install Python packages
        run: python -m pip install pyinstaller==6.22.3 -r requirements.txt

      # The unit tests stand in for the toolchains with shell scripts, so they run on Linux and
      # macOS only; on Windows the self-test below builds and runs a program with the real JWasm.
      - name: Run the unit tests
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover tests

      - name: Package and self-test
        run: |
          if [ "$RUNNER_OS" = Linux ]; then wrapper="xvfb-run -a"; else wrapper=""; fi
          python tools/package.py --version "$VERSION" --test --wrapper "$wrapper"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Run the Linux build on clean systems that only have the libraries a desktop has
  test-linux:
    name: Test linux-x64 on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'fedora:41']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - name: Install Python, Xvfb and basic desktop libraries
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -q
            DEBIAN_FRONTEND=noninteractive apt-get install -y -q python3 xvfb xauth libgl1 libegl1 libfontconfig1 libdbus-1-3
          else
            dnf install -y -q python3 xorg-x11-server-Xvfb xorg-x11-xauth mesa-libGL mesa-libEGL fontconfig dbus-libs which
          fi
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: dist
      - name: Self-test
        run: python3 tools/package.py --test-only dist/*.tar.gz --wrapper "xvfb-run -a"

  # Test the Windows and macOS builds on fresh machines without PyQt5 installed
  test-other:
    name: Test ${{ matrix.name }} on a fresh runner
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist
      - name: Self-test
        run: python3 tools/package.py --test-only dist/*.zip || python tools/package.py --test-only dist/*.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
    needs: [build, test-linux, test-other]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat > notes.md <<NOTES
          Portable builds of the 8086 Simulator: unpack the archive for your system and run the app inside. Nothing needs to be installed, and the JWasm assembler is included.

          | System | Download |
          |---|---|
          | Windows 10/11 (x64) | \`8086-Simulator-$TAG-windows-x64.zip\` |
          | macOS on Apple silicon | \`8086-Simulator-$TAG-macos-arm64.zip\` |
          | macOS on Intel | \`8086-Simulator-$TAG-macos-x64.zip\` |
          | Linux x64 (glibc 2.35+, e.g. Ubuntu 22.04+) | \`8086-Simulator-$TAG-linux-x64.tar.gz\` |

          The apps are not code-signed. On macOS, right-click the app and choose Open the first time (or run \`xattr -dr com.apple.quarantine 8086-Simulator.app\`). On Windows, SmartScreen may ask you to confirm under "More info". See README.txt in the archive for TASM setup.
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "8086 Simulator $TAG" \
            --notes-file notes.md --target "$GITHUB_SHA" *.zip *.tar.gz SHA256SUMS.txt
